<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day-9 Task-4</title>
  </head>
  <body>
    <h1>Enter Your Name and Select a Day...</h1>

    <form>
      <label
        >Name:
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your name here..." /></label
      ><br /><br />
      <label>Select a day:</label>
      <select name="day" id="day" style="width: 8rem">
        <option value="" selected readonly>--Select a day--</option>
        <option value="mon">Monday</option>
        <option value="tus">Tuesday</option>
        <option value="wed">Wednesday</option>
        <option value="thu">Thursday</option>
        <option value="fri">Friday</option>
        <option value="sat">Saturday</option>
        <option value="sun">Sunday</option>
      </select>
      <button type="button" onclick="showMessage()">Show Message</button>
    </form>
    <h2 id="message"></h2>
    <script src="script.js"></script>
  </body>
</html>
