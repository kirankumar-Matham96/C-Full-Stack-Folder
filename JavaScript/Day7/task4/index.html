<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D7 Task-4</title>
  </head>
  <body>
    <h1>Check Your Age Group</h1>
    <label
      >Enter your age:
      <input type="number" name="age" id="age" class="input" />
    </label>
    <button id="btn">Check Age Group</button>

    <p>If the age is between 0 and 12, it displays: "You are a child"</p>
    <p>If the age is between 13 and 19, it displays: "You are a teenager"</p>
    <p>If the age is between 20 and 59, it displays: "You are an adult"</p>
    <p>If the age is 60 or above, it displays: "You are a senior citizen"</p>

    <script src="script.js">
      
    </script>
  </body>
</html>
