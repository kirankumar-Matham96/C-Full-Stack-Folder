<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D7 Task-3</title>
</head>
<body>
    <h1>Even or Odd Checker</h1>
    <label for="num">Enter a number<input type="number" name="num" class="input" id="num"></label>
    <button class="btn">Check Even or Odd</button>
    <script>
        const btnEl = document.querySelector(".btn");
        btnEl.addEventListener("click", () => {
            const num = parseInt(document.querySelector("#num").value);

            if(num%2 == 0){
                alert(`The number ${num} is EVEN`);
            }else{
                alert(`The number ${num} is ODD`);
            }
        });
    </script>
</body>
</html>
