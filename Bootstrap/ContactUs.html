<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/a731b1af9c.js"
      crossorigin="anonymous"
    ></script>
    <style>
      .main-container {
        min-height: 83vh;
        height: 83vh;
        background-image: url("../images/bg4.jpg");
        opacity: 0.9;
      }
      .nav {
        padding-top: 1rem;
      }
      .about-text {
        text-indent: 1rem;
      }
      .logo-img {
        width: 60px;
      }
    </style>
  </head>
  <body class="overflow-hidden">
    <header>
      <nav
        class="navbar bg-dark navbar-expand-lg bg-body-tertiary pb-3 px-5 nav"
        data-bs-theme="dark"
      >
        <div class="container-fluid d-flex justify-content-between">
          <a class="navbar-brand" href="./index.html">
            <img
              src="../images/organic-logo.jpg"
              alt="logo"
              class="rounded-circle pe-2 logo-img"
            />
            Organics</a
          >
          <div id="navbarNavDropdown">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./index.html"
                >
                  Home
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./AboutUs.html">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./Products.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./ContactUs.html">Contact Us</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="main-container p-5 text-white fw-semibold">
      <h1 class="text-center">Contact Us</h1>
      <section class="mt-5 d-flex gap-5">
        <div class="w-50">
          <img
            src="../images/contactUs.jpg"
            alt="contact us"
            class="w-100 rounded-5"
          />
        </div>
        <form class="w-50">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="John Doe"
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="doe@gmail.com"
            />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea
              class="form-control"
              id="message"
              rows="10"
              placeholder="Write your message here..."
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary fs-4 fw-semibold">
            Send Message
          </button>
        </form>
      </section>
    </main>
    <footer
      class="text-center py-3 lh-sm d-flex justify-content-center gap-4 bg-dark text-light"
    >
      <span class="fs-3">Follow Us: </span>
      <div class="d-flex align-items-center gap-3 fs-3">
        <i class="fa-brands fa-facebook-f"></i>
        <!-- <img src="../images/instagram.svg" alt="insta"> -->
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-threads"></i>
        <i class="fa-brands fa-discord"></i>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
