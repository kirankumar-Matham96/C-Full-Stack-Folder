<!DOCTYPE html>
<html>

<head>
	<title>HTML Forms</title>
	<style>
		#formattedForm {
			display: flex;
			flex-direction: column;
			gap: 1rem;
			background-color: rgb(254, 223, 211);
			padding: 1rem;
			width: 400px;
		}
		#formattedForm > label{
			display: flex;
			justify-content: space-between;
		}
	</style>
</head>

<body>
	<!-- Task:1 -->
	<h1>Login Page....</h1>

	<form style="display: flex; flex-direction: column">
		<label style="margin-bottom: 10px">
			Username:<input type="text" placeholder="Enter User Name" name="username" id="username" required
				minlength="3" maxlength="20" />
		</label>
		<label style="margin-bottom: 10px">
			Password:<input type="password" placeholder="Enter User Password" name="password" id="password" required
				minlength="8" maxlength="16" />
		</label>
		<button style="align-self: start">Login</button>
	</form>

	<!-- Task:2 -->
	<h1>Student Result Calculation</h1>

	<form style="display: flex; flex-direction: column">
		<label style="margin-bottom: 10px">
			Student ID:<input type="number" placeholder="1001" name="studentId" id="studentId" required disabled />
		</label>
		<label style="margin-bottom: 10px">
			Student Name:<input type="text" placeholder="Enter Student Name" name="studentName" id="studentName"
				required />
		</label>
		<label style="margin-bottom: 10px">
			Maths Marks:<input type="number" style="width: 170px;" placeholder="Enter Maths Marks" min="35" max="100"
				name="maths" id="maths" required />
		</label>
		<label style="margin-bottom: 10px">
			Science Marks:<input type="number" style="width: 170px;" placeholder="Enter Science Marks" min="35"
				max="100" name="science" id="science" required />
		</label>
		<label style="margin-bottom: 10px">
			Social Marks:<input type="number" style="width: 170px;" placeholder="Enter Social Marks" min="35" max="100"
				name="social" id="social" required />
		</label>
		<button style="align-self: start">Calculate the Result</button>
	</form>

	<!-- Task:3 -->
	<h1>Book Application</h1>
	<form style="display: flex; flex-direction: column; background-color: lightgray; width:350px; padding: 1rem;">
		<label style="margin-bottom: 10px">
			Enter book ISBN:<input type="number" placeholder="Enter Book ISBN" name="bookisbn" id="bookisbn"
				value="1001" required disabled />
		</label>
		<label style="margin-bottom: 10px">
			Enter book Name:<input type="text" placeholder="Enter Book Name" name="bookName" id="bookName" required />
		</label>
		<label style="margin-bottom: 10px">
			Enter book Author:<input type="text" placeholder="Enter Book Author Name" name="bookAuthor" id="bookAuthor"
				value="Ratan Sir" required readonly />
		</label>
		<label style="margin-bottom: 10px">
			Enter book price:<input type="number" placeholder="Enter Book Price" name="bookPrice" id="bookPrice"
				required />
		</label>
		<label style="margin-bottom: 10px">
			Enter book Quantity:<input type="number" placeholder="Enter Book Quantity" min="2" max="5"
				name="bookQuantity" id="bookQuantity" required />
		</label>
		<button style="align-self: start">Submit</button>
	</form><br><br>

	<!-- Additional Task -->
	<form action="" method="post" id="formattedForm">
		<h1 align="center">Student Registration Form</h1>
		<label for="roll">Roll no. : <input type="number" id="roll" style="width: 260px"></label>
		<label for="firstName">Student Name:
			<div>
				<input type="text" placeholder="First Name" name="firstName" id="firstName" style="width: 124px">.<input type="text"
					placeholder="Last Name" name="lastName" id="lastName" style="width: 124px">
			</div>
		</label>
		<label for="fathersName">Father's Name: <input type="text" name="fathersName" id="fathersName"  style="width: 260px"></label>
		<label for="dob">
			Date of Birth:
			<div>
				<input type="number" name="date" id="date" placeholder="Day" min="1" max="31" style="width: 38px"> -
				<input type="number" name="month" id="month" placeholder="Month" min="1" max="12" style="width: 52px"> -
				<input type="number" name="year" id="year" placeholder="Year" min="1900" max="2024" style="width: 42px">
				<small>
					<small>&nbsp;&nbsp;(DD-MM-YYY)</small>
				</small>
			</div>
		</label>
		<label for="mobile">Mobile No. :
			<div>

				<select name="countryCode" id="countryCode">
					<option value="+1">+1</option>
					<option value="+44">+44</option>
					<option value="+91">+91</option>
					<option value="+61">+61</option>
					<option value="+81">+81</option>
					<option value="+66">+66</option>
				</select> -
				<input type="tel" id="mobile" name="mobile" style="width: 200px;">
			</div>
		</label>
		<label for="email">Email: <input type="email" id="email" name="email" style="width: 260px"></label>
		<label for="password">Password: <input type="password" id="password" name="password" style="width: 260px"></label>
		<label for="gender">Gender:
			<div style="margin-right: 9rem">
				<input type="radio" name="gender" id="male" value="male"><label for="male">Male</label>
				<input type="radio" name="gender" id="female" value="female"><label for="female">Female</label>
			</div>
		</label>
		<label>Department:
			<div style="margin-right: 0.8rem">
				<input type="checkbox" name="department" id="cse" value="cse"><label for="cse">CSE</label>
				<input type="checkbox" name="department" id="it" value="it"><label for="it">IT</label>
				<input type="checkbox" name="department" id="ece" value="ece"><label for="ece">ECE</label>
				<input type="checkbox" name="department" id="eee" value="eee"><label for="eee">EEE</label>
				<input type="checkbox" name="department" id="mech" value="mech"><label for="mech">Mech</label>
			</div>
		</label>
		<label for="cource">Course:
			<div>
				<select name="cource" id="cource" style="width: 265px">
					<option value="" readonly selected disabled>Select Current Course</option>
					<option value="coreJava">Core Java</option>
					<option value="advancedJava">Advanced Java</option>
					<option value=".netCore">.Net Core</option>
					<option value=".netMVC">.Net MVC</option>
					<option value="devops">Devops</option>
					<option value="Python">Python</option>
				</select>
			</div>
		</label>
		<label for="image">Student Image: <input type="file" name="image" id="image" style="margin-right: 10px"></label>
		<label>City: <input type="text" name="city" id="city" style="width: 260px"></label>
		<label>Address: <textarea name="address" rows="4" style="width: 260px"></textarea></label>
		<button type="submit" style="align-self: center;">Register</button>
	</form>

</body>

</html>
