<!DOCTYPE html>
<html>

<head>
	<title>Forms</title>
</head>

<body>
	<!-- Task:1 -->
	<form action="./Day1.html" style="display: flex; flex-direction: column; width: 70vw">
		<fieldset style="display: flex; flex-direction: column;">
			<legend>Fill the Address Details</legend>
			<div style="display: flex; gap: 1rem;margin-bottom: 1rem">
				<input type="text" placeholder="Address Line 1:" name="addl1" id="addl1" required />
				<input type="text" placeholder="Address Line 2:" name="addl2" id="addl2" required />
			</div>

			<div style="display: flex; gap: 1rem;margin-bottom: 1rem">
				<input type="text" placeholder="City:" name="city" id="city" required />
				<input type="text" placeholder="State/Province/Region:" name="state" id="state" required />
			</div>
			<div style="display: flex; gap: 1rem;margin-bottom: 1rem">
				<input type="text" placeholder="Postal/Zip Code:" name="city" id="city" required />
				<label>Country:</label>
				<select name="country" id="country">
					<option default>Select</option>
					<option value="india">India</option>
					<option value="japan">Japan</option>
					<option value="china">China</option>
					<option value="korea">Korea</option>
					<option value="other">Other</option>
				</select>
			</div>
		</fieldset>
	</form>

	<!-- Task:2 -->
	<div style="margin-left: 1rem">
		<h1>Doctor Appointment Form</h1>
		<form action="./Day2.html" style="display: flex; flex-direction: column; gap: 1rem;">
			<label>Doctor Appointment Date and Time: <input type="datetime-local" name="dateTime"></label>
			<label>Month of Birth<input type="month" name="mob"></label>
			<label>Week of Birth: <input type="week" name=""></label>
			<label>Time of Birth: <input type="time" name=""></label>
			<button type="submit" style="align-self: start;">Book Appointment</button>
		</form>
	</div>

	<!-- Task:3 -->
	<form action="" style="margin-bottom: 2rem;">
		<fieldset style="display: flex; flex-direction: column; width: 70vw">
			<legend>Hobbies</legend>
			<label><input type="checkbox"> Reading</label>
			<label><input type="checkbox"> Traveling</label>
			<label><input type="checkbox"> Cooking</label>
			<label><input type="checkbox"> Gardening</label>
			<label><input type="checkbox"> Sports</label>
			<label><input type="checkbox"> Music</label>
		</fieldset>
		<br><br>

		<label for="experience">Experience Level:
			<select name="experience" id="experience">
				<option value="fresher">Fresher</option>
				<option value="junior">Junior</option>
				<option value="mid-level">Mid-Level</option>
				<option value="senior">Senior</option>
			</select>
		</label>
		<br><br>

		<label for="products">Select Products To Purchase:
			<select name="products" id="products" multiple>
				<option value="laptop">Laptop</option>
				<option value="smartphone">Smartphone</option>
				<option value="headphones">Headphones</option>
				<option value="keboard">Keboard</option>
			</select>
		</label>
	</form>

	<!-- Task:4 -->
	<h3>### Unfinished ###</h3>
	<div style="margin-left: 1rem;">
		<h2>Predefined Options for an input element:</h2>
		<form style="display: flex; flex-direction: column; gap: 1rem">
			<label>Company Name <input type="text"></label>
			<label>Company Joining Date <input type="datetime-local" name="joiningDate"></label>
			<label>Company Website <input type="url" name="url"></label>
			<label><input type="checkbox" name="termsAndCondition"> Please accept terms and conditions</label>
			<input type="submit" style="align-self: start;">
		</form>
	</div>

	<!-- Task:5 -->
	<div style="display: flex; flex-direction: column;margin-top: 2rem;">
		<label><input type="checkbox" name="terms"> I agree to the <a href="#">Terms and Conditions</a></label>
		<label><input type="checkbox" name="policy"> I agree to the <a href="#">Privacy Policy</a></label>
		<label><input type="checkbox" name="policy"> Subscribe to our newsletter</label>
	</div>

	<!-- Task:6 -->
	<div style="margin-top: 2rem;">
		<p>Security Question</p>
		<select name="securityQuestion" id="secQ">
			<option value="" selected disabled>Select a securit question</option>
			<option value="what is our favourit food?">What is our favourit food?</option>
			<option value="what is your birth place?">what is your birth place?</option>
			<option value="what is your mother's name?">what is your mother's name?</option>
		</select><br><br>
		<input type="text" name="ans" id="ans" placeholder="Answer the security question">
	</div>

	<!-- Task:7 -->
	<center>
		<div style="margin: 2rem 0 5rem 0;">
			<h1>Login Page</h1>
			<table border="1">
				<thead></thead>
				<tbody>
					<tr>
						<td>Username:</td>
						<td style="width: 8rem"></td>
					</tr>
					<tr>
						<td>Password:</td>
						<td style="width: 8rem"></td>
					</tr>
					<tr>
						<td colspan="2" align="center">
							<button type="submit">Login</button>
						</td>
					</tr>
				</tbody>
			</table>

		</div>
	</center>
</body>

</html>
