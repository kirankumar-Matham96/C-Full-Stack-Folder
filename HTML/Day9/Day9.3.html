<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs</title>
    <style>
        h1{
            font-size: 4rem;
            font-weight: bolder;
        }
        h2{
            font-size: 3rem;
            font-weight: bolder;}
    </style>
</head>
<body style="display: flex; font-size: 2rem; gap: 10rem;">
    <div>
        <h1><i>This is Div 1</i></h1>
        <h2>Vegitables</h2>
        <ol>
            <li>Tomato</li>
            <li>Carrot</li>
            <li>Spinach</li>
        </ol>
    </div>
    <div>
        <h1><i>This is Div 2</i></h1>
        <h2>Fruits</h2>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Oange</li>
        </ul>
    </div>
</body>
</html>
