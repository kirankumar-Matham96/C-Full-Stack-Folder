<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Sathya Page</title>
    <script src="https://kit.fontawesome.com/a731b1af9c.js" crossorigin="anonymous"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", sans-serif;
        }
        .logo{
            position: relative;
        }
        .logo>span{
            position: absolute;
            bottom: -1.7rem;
            left: 0;
            font-size: 16px; 
            font-weight:bolder; 
            line-height: 0; 
            padding: 0; 
            margin: 0;
        }
        ul>li>a{
            color: rgb(92, 92, 92);
            text-decoration: none;
        }
        a{
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5rem 2rem 0; background-color: aliceblue;">
        <div style="display: flex; align-items: center; gap: 1rem">
            <div
                style=" width: 2.5rem; height: 2.5rem; border:6px solid orange; rotate: 45deg; margin: 10px 0 0 5rem">
            </div>
            <div class="logo">
                <h1 style="line-height: 0; font-size: 3.1rem; margin-top: 0">Sath<u style="text-decoration-thickness: 0.5rem;">ya</u><sup><span style="font-size: 12px;">TM</span></sup></h1>
                <span style="font-size: 14px; font-weight:bold; line-height: 0; padding: 0; margin: -50px 0 0 0">TECHNOLOGIES</span>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; width: 25vw">
            <i class="fa-brands fa-facebook" style="color: blue; font-size: 1.8rem;"></i>
            <i class="fa-brands fa-instagram" style="color: pink; font-size: 1.8rem;"></i>
            <i class="fa-brands fa-youtube" style="color: red; font-size: 1.8rem;"></i>
            <button style="background-color: green; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-size: 1.3rem">Whatsapp Us</button>
        </div>
    </header>
    <nav style="padding: 0 20rem; background-color: rgba(0, 255, 255, 0.433);">
        <ul style="list-style-type:none; display: flex; justify-content: space-evenly; gap: 3rem; padding: 1rem 0; font-size: 1.2rem; font-weight: bold;">
            <li><a href="#"><i class="fa-solid fa-house"></i>&nbsp;Home</a></li>
            <li><a href="#"><i class="fa-solid fa-book"></i>&nbsp;Courses</a></li>
            <li><a href="#"><i class="fa-solid fa-clock"></i>&nbsp;New Batches</a></li>
            <li><a href="#"><i class="fa-solid fa-book-bookmark"></i>&nbsp;Internships</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i>&nbsp;Trainer Registration</a></li>
            <li><a href="#"><i class="fa-solid fa-phone"></i>&nbsp;Get in Touch</a></li>
        </ul>
    </nav>
    <main>
        <div style="background-color: lightskyblue; display: flex; justify-content: center;align-items: center;height: 25vh; font-size: 1.8rem"><h1>Class room schedules</h1></div>
        <div style="margin: 3rem 18rem; border: 1px solid; display: flex; justify-content: space-around; align-items: center; padding: 2rem 0; gap: 2rem;background-color: rgba(255, 230, 0, 0.888);">
            <div style="border-radius: 22rem; height: 12rem; width: 12rem; background-color: white; display: flex; justify-content: center; align-items: center;">
                <p align="center" style="font-size: 2rem;">DAILY<br>8 HOURS <strong>TRAINING</strong></p>
            </div>
            <div style="text-align: center;">
                <h3 style="font-size: 2rem;">CLASS ROOM TRAINING</h3><br>
                <h1 style="font-size: 4rem;">JAVA & .NET FULL STACK</h1><br>
                <h4 style="font-size: 1.8rem;">BY KANNABABU</h4>
            </div>
            <div>
                <img src="./job-guarantee.png" alt="job guarantee" style="width: 12rem">
            </div>
        </div>
        <div style="margin: 0 auto; width: 80vw; height: 2rem; background-color: darkslategray;"></div>
    </main>
    <footer style="display: flex; justify-content: center; align-items: center; gap: 3rem; padding: 2rem 0; background-color: lightgray; font-size: 1.2rem; font-weight: bold;">
        <a href="#">sathyatech</a>
        <a href="#">vijetha Super market</a>
        <a href="#">DMART</a>
    </footer>
</body>

</html>
