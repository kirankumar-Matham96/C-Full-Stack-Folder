<div>
  <h1>Employee Information</h1>
  @for (employee of empData; track employee.id) {
    <div class="border border-gray p-3 m-3 rounded-5 bg-dark text-light d-flex">
      <div class="">
        <p>ID: {{ employee.id }}</p>
        <p>Name: {{ employee.name }}</p>
        <p>Email: {{ employee.email }}</p>
        <p>Salary: {{ employee.salary }}</p>
        <p>Department: {{ employee.department }}</p>
      </div>
      <div class="image-stles">
        <img
        [src]="`https://randomuser.me/api/portraits/women/${employee.id - 1000}.jpg`"
        alt="women-employee"
        class="w-100"
        />
      </div>
    </div>
  }
</div>
