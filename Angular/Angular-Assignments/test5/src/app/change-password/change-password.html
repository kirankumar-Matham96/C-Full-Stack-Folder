<div class="container">
  <h1>Change Password Form</h1>
  <div [formGroup]="changePassForm">
    Password
    <input type="password" formControlName="password" class="form-control w-50" />
    Confirm Password
    <input type="password" formControlName="cpassword" class="form-control w-50" />
    <div *ngIf="changePassForm['errors']?.['mismatch']" class="text-danger">*Passwords not matched</div>
    <button class="btn btn-primary mt-3" (click)="clearForm()">Click</button>
  </div>
</div>
